name: Block exports artefacts in PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if exports directory is modified
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^exports/'; then
            echo "❌ exports/ artefacts must not be committed. Use SharePoint Copilot-Manifests only."
            exit 1
          fi